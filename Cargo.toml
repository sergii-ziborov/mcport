[workspace]
members = ["mcport-macros"]
exclude = ["benchmarks/competitors"]
resolver = "2"

[package]
name = "mcport"
version = "0.6.0"
edition = "2021"
rust-version = "1.78"
description = "Fast, bounded, Tokio-free MCP stdio runtime with FastMCP-like Rust tools"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/mcport"
documentation = "https://docs.rs/mcport"
readme = "README.md"
exclude = ["benchmarks/competitors/**"]
keywords = ["mcp", "mcp-protocol", "stdio", "json-rpc", "server"]
categories = ["development-tools", "network-programming"]

[dependencies]
blazingly-json = "0.1.0"
mcport-macros = { path = "mcport-macros", version = "0.6.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = ["macros"]
macros = ["dep:mcport-macros"]
subprocess-tests = []

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "runtime"
harness = false

[[bin]]
name = "mcport-test-server"
path = "tests/support/stdio_server.rs"
required-features = ["subprocess-tests"]
test = false
bench = false
doc = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
