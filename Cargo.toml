[package]
name = "weavatrix-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Blocking, dependency-light MCP stdio server runtime with no async executor"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-mcp"
documentation = "https://docs.rs/weavatrix-mcp"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "stdio", "json-rpc", "server"]
categories = ["development-tools", "network-programming"]

[dependencies]
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
