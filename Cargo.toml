[package]
name = "mcport"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Fast, Tokio-free MCP stdio server runtime with typed tools"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/mcport"
documentation = "https://docs.rs/mcport"
readme = "README.md"
exclude = ["benchmarks/competitors/**"]
keywords = ["mcp", "model-context-protocol", "stdio", "json-rpc", "server"]
categories = ["development-tools", "network-programming"]

[dependencies]
blazingly-json = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "runtime"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
