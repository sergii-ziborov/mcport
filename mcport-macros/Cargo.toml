[package]
name = "mcport-macros"
version = "0.6.0"
edition = "2021"
rust-version = "1.78"
description = "Procedural macros for registering ordinary Rust functions as MCPort tools"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/mcport"
documentation = "https://docs.rs/mcport"
readme = "README.md"
keywords = ["mcp", "macros", "proc-macro"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
