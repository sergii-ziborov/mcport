name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Verify immutable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${RELEASE_TAG#v}" != "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$VERSION"
          fi
      - name: Require crates.io credentials
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Verify macros package
        run: cargo publish --locked --dry-run --manifest-path mcport-macros/Cargo.toml
      - name: Publish macros to crates.io
        run: cargo publish --locked --manifest-path mcport-macros/Cargo.toml
      - name: Wait for crates.io to index mcport-macros
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' mcport-macros/Cargo.toml | head -n 1)
          for attempt in $(seq 1 20); do
            if cargo search mcport-macros --limit 1 | grep -q "mcport-macros = \"$VERSION\""; then
              exit 0
            fi
            sleep 15
          done
          echo "mcport-macros $VERSION is not visible on crates.io yet" >&2
          exit 1
      - name: Publish to crates.io
        run: cargo publish --locked --package mcport
