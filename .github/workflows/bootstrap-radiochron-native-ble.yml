name: Bootstrap radiochron-native-ble

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      EXPECTED_SHA: b6738ff91cec00490e070460bb942a394409404f
    steps:
      - uses: actions/checkout@v6
        with:
          repository: sergii-ziborov/radiochron-native-ble
          ref: b6738ff91cec00490e070460bb942a394409404f
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux D-Bus build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Verify pinned release source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" = "0.1.0"
      - name: Require crates.io credentials
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --locked --dry-run
      - run: cargo publish --locked
